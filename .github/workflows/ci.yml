name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [dev, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prompts:check
      - name: Enforce released prompt immutability
        env:
          PROMPT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$PROMPT_BASE" ] && [ "$PROMPT_BASE" != "0000000000000000000000000000000000000000" ]; then
            npm run prompts:check -- --base "$PROMPT_BASE"
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
